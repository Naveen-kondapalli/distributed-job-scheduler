spring:
  application:
    name: job-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/job_scheduler}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    # JWT_SECRET must be supplied through an environment variable outside local development.
    secret: ${JWT_SECRET:change-this-development-secret-key-minimum-32-characters}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

job-run:
  cancellation:
    signal-ttl-seconds: ${JOB_RUN_CANCELLATION_SIGNAL_TTL_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} jobId=%X{jobId:-} runId=%X{runId:-} eventId=%X{eventId:-} executorId=%X{executorId:-} retryCount=%X{retryCount:-} - %msg%n"
