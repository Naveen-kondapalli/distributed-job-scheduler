spring:
  application:
    name: job-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/job_scheduler}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata

server:
  port: ${SERVER_PORT:8080}

security:
  jwt:
    # JWT_SECRET must be supplied through an environment variable outside local development.
    secret: ${JWT_SECRET:change-this-development-secret-key-minimum-32-characters}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
