spring:
  application:
    name: executor-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/job_scheduler}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${EXECUTOR_CONSUMER_GROUP:executor-service}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring.lifecycle.timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

logging:
  level:
    root: INFO

executor:
  instance-id: ${EXECUTOR_INSTANCE_ID:}
  kafka:
    topic: ${EXECUTOR_RUN_TOPIC:run}
    retry-topic: ${EXECUTOR_RETRY_TOPIC:retry}
    dead-topic: ${EXECUTOR_DEAD_TOPIC:dead}
    concurrency: ${EXECUTOR_KAFKA_CONCURRENCY:3}
  http:
    connect-timeout-ms: ${EXECUTOR_HTTP_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${EXECUTOR_HTTP_READ_TIMEOUT_MS:10000}
    allowed-hosts: ${EXECUTOR_HTTP_ALLOWED_HOSTS:jsonplaceholder.typicode.com}
    idempotency-key-header: ${EXECUTOR_HTTP_IDEMPOTENCY_KEY_HEADER:Idempotency-Key}
  retry:
    base-delay-ms: ${EXECUTOR_RETRY_BASE_DELAY_MS:2000}
    max-delay-ms: ${EXECUTOR_RETRY_MAX_DELAY_MS:60000}
    jitter-factor: ${EXECUTOR_RETRY_JITTER_FACTOR:0.20}
    scheduler-interval-ms: ${EXECUTOR_RETRY_SCHEDULER_INTERVAL_MS:500}
    batch-size: ${EXECUTOR_RETRY_BATCH_SIZE:100}
  execution:
    running-timeout-ms: ${EXECUTOR_RUNNING_TIMEOUT_MS:60000}
  heartbeat:
    enabled: ${EXECUTOR_HEARTBEAT_ENABLED:true}
    interval-ms: ${EXECUTOR_HEARTBEAT_INTERVAL_MS:10000}
    ttl-seconds: ${EXECUTOR_HEARTBEAT_TTL_SECONDS:30}
  cancellation:
    signal-ttl-seconds: ${EXECUTOR_CANCELLATION_SIGNAL_TTL_SECONDS:60}
    recovery-interval-ms: ${EXECUTOR_CANCELLATION_RECOVERY_INTERVAL_MS:5000}
